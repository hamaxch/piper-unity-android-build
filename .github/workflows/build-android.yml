name: Build Android Piper Unity Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Show folders
        run: |
          ls -la
          echo "NDK path:"
          echo $ANDROID_NDK_HOME

      - name: Build placeholder native lib
        run: |
          mkdir -p output/arm64-v8a
          echo "This is only placeholder. Real Piper native build is next step." > output/arm64-v8a/README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper-android-libs
          path: output/
