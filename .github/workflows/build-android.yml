name: Build Android Piper Unity Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build arm64-v8a with 16KB alignment
        run: |
          rm -rf build-arm64 output

          cmake -B build-arm64 -S native \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"

          cmake --build build-arm64 --config Release

      - name: Check ELF alignment
        run: |
          echo "Checking ELF LOAD segment alignment..."
          readelf -lW build-arm64/libpiperunity.so | grep LOAD

          echo "Checking for 16KB alignment..."
          if readelf -lW build-arm64/libpiperunity.so | grep LOAD | grep -q "0x4000"; then
            echo "OK: 16KB alignment found."
          else
            echo "ERROR: 16KB alignment not found."
            exit 1
          fi

      - name: Prepare output
        run: |
          mkdir -p output/arm64-v8a
          cp build-arm64/libpiperunity.so output/arm64-v8a/
          ls -lh output/arm64-v8a/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper-android-libs-${{ github.run_number }}
          path: output/
